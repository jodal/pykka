[project]
site_name = "Pykka"
site_description = "Pykka makes it easier to build concurrent applications."
site_url = "https://pykka.readthedocs.io/stable/"
copyright = "Copyright © 2010-2026 Stein Magnus Jodal and contributors"
repo_name = "jodal/pykka"
repo_url = "https://github.com/jodal/pykka"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascript/readthedocs.js"]
nav = [
    {"Introduction" = [
        "index.md",
    ]},
    {"Getting started" = [
        "getting-started/index.md",
        "getting-started/model.md",
        "getting-started/actors.md",
        "getting-started/proxies.md",
    ]},
    {"Guides" = [
        "guides/index.md",
        "guides/logging.md",
        "guides/testing.md",
        "guides/deadlocks.md",
        "guides/proxy-typing.md",
    ]},
    {"Reference" = [
        "reference/index.md",
        "reference/actors.md",
        "reference/proxies.md",
        "reference/futures.md",
        "reference/registry.md",
        "reference/runtimes.md",
        "reference/exceptions.md",
        "reference/messages.md",
        "reference/debug.md",
        "reference/typing.md",
    ]},
    {"Examples" = [
        "examples/index.md",
        "examples/basic.md",
        "examples/proxy.md",
        "examples/cooperation.md",
        "examples/worker-pool.md",
        "examples/mopidy.md",
    ]},
]

[project.theme]
custom_dir = "docs/_theme"
features = [
    "content.action.edit",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.sections",
]

[project.theme.icon]
logo = "fontawesome/solid/spiral"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "purple"
accent = "deep purple"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "purple"
accent = "deep purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "purple"
accent = "deep purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jodal/pykka"

[project.plugins.exclude]
glob = ["_theme/*"]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "list"
filters = [
    "!^_[^_]",
    "!^__post_init__",
    "!^__len__",
    "!^__repr__",
    "!^__str__",
]
separate_signature = true
show_docstring_examples = true
show_root_heading = true
show_root_toc_entry = false
show_symbol_type_heading = true
show_symbol_type_toc = true
show_signature_annotations = true

[project.markdown_extensions.pymdownx.blocks.admonition]
[project.markdown_extensions.pymdownx.blocks.definition]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
default_lang = "python"
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.magiclink]
repo_url_shorthand = true
user = "jodal"
repo = "pykka"

[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
