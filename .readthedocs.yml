version: 2

build:
  os: "ubuntu-26.04"
  tools:
    python: "3.14"
  jobs:
    build:
      html:
        - zensical build --strict
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp -r site/* $READTHEDOCS_OUTPUT/html/

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
